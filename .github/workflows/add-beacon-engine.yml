          def main():
              # A commit that touches a workflow file cannot be pushed with the built-in token, so a patch
              # that produced one would fail at the very last step with everything else already done.
              for path in list(NEW) + [path for path, _, _ in EDITS]:
                  if path.startswith(".github/"):
                      print("refusing to touch %s: the built-in token cannot push workflow changes" % path)
                      return 1

              # Nothing is written unless every anchor is found exactly once, and no new file lands unless
              # all of them are missing. A patch that half-applies is worse than one that does not apply.
              for path in NEW:
                  if os.path.exists(path):
                      print("refusing to overwrite an existing %s" % path)
                      return 1

              staged = {}
              for path, old, replacement in EDITS:
                  text = staged.get(path)
                  if text is None:
                      if not os.path.exists(path):
                          print("missing file: %s" % path)
                          return 1
                      with open(path, encoding="utf-8") as handle:
                          text = handle.read()
                  hits = text.count(old)
                  if hits != 1:
                      print("anchor matched %d times (expected 1) in %s: %s"
                            % (hits, path, old.strip().splitlines()[0][:100]))
                      return 1
                  staged[path] = text.replace(old, replacement, 1)

              for path, content in NEW.items():
                  directory = os.path.dirname(path)
                  if directory:
                      os.makedirs(directory, exist_ok=True)
                  with open(path, "w", encoding="utf-8") as handle:
                      handle.write(content)
                  print("added %s" % path)

              for path, text in staged.items():
                  with open(path, "w", encoding="utf-8") as handle:
                      handle.write(text)
                  print("patched %s" % path)

              print("%d new files, %d anchors across %d files" % (len(NEW), len(EDITS), len(staged)))
              return 0


          if __name__ == "__main__":
              sys.exit(main())

