name: ship 2.13.4

# One-shot. Run it AFTER ship 2.13.3 has finished.
#
# The Support Channel chip still ran off the right edge in 2.13.3. It was a toolbar menu action
# view, and ActionMenuView throws away an action view's margins, so the 12dp gap never applied.
# This makes the chip a direct child of the toolbar with a 12dp end inset, wires its tap directly,
# and deletes the now-unused toolbar menu. Nothing else changes.
#
# Then it moves the version to 2.13.4 / versionCode 37, tags v2.13.4 and starts the release build.
# Safe to run twice: if v2.13.4 already exists it stops. Remove this file by hand afterwards.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ship-2-13-4.yml' ]

permissions:
  contents: write
  actions: write

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      TAG: v2.13.4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check order
        id: guard
        run: |
          git fetch --tags -q origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q "versionName '2.13.3'" android/app/build.gradle; then
            echo "main is not on 2.13.3 yet. Let ship 2.13.3 finish first, then run this again from the Actions tab."
            exit 1
          fi

      - name: Move the chip into the toolbar
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/chip_patch.py"
          python3 "$RUNNER_TEMP/chip_patch.py"
          python3 -c "import xml.dom.minidom as m; m.parse('android/app/src/main/res/layout/activity_main.xml')"
          ! grep -rn "action_telegram\|main_toolbar" android/app/src

      - name: Move the version to 2.13.4
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          sed -i "s/versionCode 36$/versionCode 37/; s/versionName '2.13.3'/versionName '2.13.4'/" android/app/build.gradle
          sed -i 's/"version": "2.13.3"/"version": "2.13.4"/' package.json
          grep -q "versionCode 37$" android/app/build.gradle
          grep -q "versionName '2.13.4'" android/app/build.gradle
          grep -q '"version": "2.13.4"' package.json
          git config user.name "Panther"
          git config user.email "panther@users.noreply.invalid"
          git add -A android package.json
          git commit -qm "Keep the Support Channel chip inside the toolbar, release 2.13.4"
          git log -2 --format='%h %an %s'

      - name: Push main and the tag
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "$TAG"

      - name: Start the release build on the tag
        if: steps.guard.outputs.skip != '1'
        run: gh workflow run release.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
