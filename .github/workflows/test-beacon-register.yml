name: test beacon register

# One-shot TEST build. Upload it INTO .github/workflows/ (open that folder first, then upload).
#
# Puts the "register Turbo's identity through Beacon" change on branch beacon-register (main is
# not touched, no tag, no Release) and starts Android release on that branch, so the APK lands
# as the Panther-VPN-Android artifact of that run (kept 3 days). Same version as 2.13.6, so it
# installs straight over it. Remove this file by hand afterwards.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/test-beacon-register.yml' ]

permissions:
  contents: write
  actions: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      BRANCH: beacon-register
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the Beacon registration change
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH"
          echo '' | base64 -d > "$RUNNER_TEMP/beacon_reg.py"
          python3 "$RUNNER_TEMP/beacon_reg.py"
          python3 -c "import xml.dom.minidom as m; m.parse('android/app/src/main/res/values/strings.xml')"
          grep -q "bootstrapIdentityThroughBeacon" android/app/src/main/java/com/firstham/aethergui/AetherVpnService.java
          git config user.name "Panther"
          git config user.email "panther@users.noreply.invalid"
          git add -A android
          git commit -qm "Register Turbo's identity through Beacon when the network blocks registration"
          git log -2 --format='%h %an %s'

      - name: Push the branch and build it
        run: |
          set -euo pipefail
          git push -f origin "$BRANCH"
          gh workflow run release.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
