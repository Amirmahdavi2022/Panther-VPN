name: test global register

# One-shot TEST build. Upload it INTO .github/workflows/ (open that folder first, then upload).
#
# When Turbo has no saved identity and this network blocks Cloudflare's registration, Panther now
# registers it once through Global (the Psiphon engine already in the app), then Beacon if Global
# can't. Put on branch global-register (main untouched, no tag, no Release), then Android release
# runs on that branch and the APK lands as the Panther-VPN-Android artifact (kept 3 days).
# Same version as 2.13.6, so it installs straight over it. Remove this file by hand afterwards.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/test-global-register.yml' ]

permissions:
  contents: write
  actions: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      BRANCH: global-register
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the registration change
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH"
          echo '' | base64 -d > "$RUNNER_TEMP/global-register.patch"
          git apply --check "$RUNNER_TEMP/global-register.patch"
          git apply "$RUNNER_TEMP/global-register.patch"
          python3 -c "import xml.dom.minidom as m; m.parse('android/app/src/main/res/values/strings.xml')"
          grep -q "registerThroughGlobal" android/app/src/main/java/com/firstham/aethergui/AetherVpnService.java
          git config user.name "Panther"
          git config user.email "panther@users.noreply.invalid"
          git add -A android
          git commit -qm "Register Turbo's identity through Global, then Beacon, when the network blocks registration"
          git log -2 --format='%h %an %s'

      - name: Push the branch and build it
        run: |
          set -euo pipefail
          git push -f origin "$BRANCH"
          gh workflow run release.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
