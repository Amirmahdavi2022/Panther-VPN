name: Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vpnLib (the OpenVPN engine) is a pinned submodule.
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem -Path @(
            (Join-Path $env:ANDROID_HOME 'cmdline-tools'),
            (Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools')
          ) -Filter 'sdkmanager.bat' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw 'Android sdkmanager.bat was not found on the hosted runner.' }
          & $sdkManager 'ndk;27.2.12479018'


      - name: Fetch verified Android native assets
        run: npm run fetch:android
      - name: Verify every native core landed in jniLibs
        shell: pwsh
        run: |
          # A green build once shipped with a core missing from it. Fail loudly instead.
          $missing = @()
          foreach ($abi in @('arm64-v8a','armeabi-v7a','x86_64')) {
            foreach ($lib in @('libaether.so','libhev-socks5-tunnel.so')) {
              $p = "android/app/src/main/jniLibs/$abi/$lib"
              if (-not (Test-Path $p)) { $missing += $p } else { Write-Host "$p $((Get-Item $p).Length) bytes" }
            }
          }
          if ($missing.Count) { throw "Native cores missing: $($missing -join ', ')" }

      - name: Let :app shrink the VPN engine, not vpnLib itself
        shell: pwsh
        run: |
          # vpnLib ships `minifyEnabled true`, so it runs its OWN R8 pass and publishes an
          # obfuscated library. Consumers still COMPILE against the un-obfuscated classes, so any
          # engine class the library's proguard file forgets to keep compiles fine and then throws
          # NoClassDefFoundError on device. That is exactly what crashed the app on launch.
          # Shrinking once, in :app, where proguard-rules.pro keeps de.blinkt.** wholesale, removes
          # the entire class of bug. Fail loudly rather than silently building the broken shape.
          $f = 'android/vpnLib/build.gradle'
          if (-not (Test-Path $f)) { throw "$f is missing - was the submodule checked out?" }
          $before = Get-Content $f -Raw
          if ($before -notmatch 'minifyEnabled\s+true') { throw "Expected 'minifyEnabled true' in $f and did not find it. Refusing to build a shape nobody has checked." }
          $after = $before -replace 'minifyEnabled\s+true', 'minifyEnabled false'
          Set-Content -Path $f -Value $after -NoNewline
          if ((Get-Content $f -Raw) -match 'minifyEnabled\s+true') { throw "Patch did not apply to $f." }
          Write-Host "vpnLib self-minification disabled."

      - name: Run unit tests
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat --no-daemon --stacktrace testDebugUnitTest 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Android signing key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force android/.android-signing | Out-Null
          [IO.File]::WriteAllBytes("android/.android-signing/firstham-aethergui.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed Android APKs
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: .android-signing/firstham-aethergui.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Set-Location android
          ./gradlew.bat --stacktrace :app:assembleRelease :app:lintRelease 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Android pull request build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat assembleDebug lintDebug

      - name: Publish the failure log
        if: failure()
        shell: pwsh
        run: |
          # Issues are disabled on this repository and raw CI logs are not always downloadable,
          # so the only channel guaranteed to work is the repository itself. Push the tail of the
          # Gradle output to a dedicated branch that is never merged.
          $logPath = Join-Path $env:GITHUB_WORKSPACE "build.log"
          if (-not (Test-Path $logPath)) {
            Set-Content -Path $logPath -Value "No build.log; the run failed before Gradle started."
          }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          Get-Content $logPath -Tail 400 | Set-Content -Path "ci-logs/$short.log" -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-failures 2>$null
          git reset
          git add -f "ci-logs/$short.log"
          git commit -q -m "Build failure log for $short"
          git push -f origin ci-failures
          Write-Host "Failure log pushed to the ci-failures branch as ci-logs/$short.log"

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item android/app/build/outputs/apk/release/app-universal-release.apk   "release/Panther-VPN-v${version}-Universal.apk"
          Copy-Item android/app/build/outputs/apk/release/app-arm64-v8a-release.apk   "release/Panther-VPN-v${version}-ARM64.apk"
          Copy-Item android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release/Panther-VPN-v${version}-ARMv7.apk"
          Copy-Item android/app/build/outputs/apk/release/app-x86_64-release.apk      "release/Panther-VPN-v${version}-x86_64.apk"
          Get-ChildItem release -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Panther-VPN-Android
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            # Panther VPN

            Android release.

            The bundled Aether Core is fetched from its official release and
            SHA-256 verified during the build. Android 8.0+ is supported and
            APKs are release-signed.
