name: Windows and Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warpplus:
    name: Build warp-plus cores (all ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build warp-plus for each ABI
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bepass-org/warp-plus.git wp
          cd wp
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK" && test -d "$NDK" || { echo "::error::Android NDK not found on runner"; exit 1; }
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="$GITHUB_WORKSPACE/warpplus"
          build() {
            echo "--- $1"
            mkdir -p "$OUT/$1"
            env CGO_ENABLED=1 GOOS=android GOARCH="$2" $4 CC="$BIN/$3" go build -trimpath -ldflags="-s -w" -o "$OUT/$1/libwarpplus.so" .
          }
          build arm64-v8a arm64 aarch64-linux-android26-clang ""
          build armeabi-v7a arm armv7a-linux-androideabi26-clang "GOARM=7"
          build x86_64 amd64 x86_64-linux-android26-clang ""
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="$OUT/$abi/libwarpplus.so"
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
            echo "$abi $(stat -c%s "$f") bytes"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: warpplus-cores
          path: warpplus/**
          if-no-files-found: error

  build:
    needs: warpplus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem -Path @(
            (Join-Path $env:ANDROID_HOME 'cmdline-tools'),
            (Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools')
          ) -Filter 'sdkmanager.bat' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw 'Android sdkmanager.bat was not found on the hosted runner.' }
          & $sdkManager 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
      - name: Fetch and verify Aether core
        run: npm run fetch:core
      - name: Fetch and verify routing engine
        run: npm run fetch:routing
      - name: Test frontend
        run: npm test
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build application and installers
        run: npm run build

      - name: Fetch verified Android native assets
        run: npm run fetch:android

      - uses: actions/download-artifact@v4
        with:
          name: warpplus-cores
          path: warpplus
      - name: Install warp-plus cores for every ABI
        shell: pwsh
        run: |
          foreach ($abi in @('arm64-v8a','armeabi-v7a','x86_64')) {
            $src = "warpplus/$abi/libwarpplus.so"
            if (-not (Test-Path $src)) { throw "warp-plus core missing for $abi" }
            $dest = "android/app/src/main/jniLibs/$abi"
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item -LiteralPath $src -Destination (Join-Path $dest 'libwarpplus.so') -Force
            Write-Host "Installed warp-plus core for $abi"
          }

      - name: Prepare Android signing key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force android/.android-signing | Out-Null
          [IO.File]::WriteAllBytes("android/.android-signing/firstham-aethergui.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed Android APKs
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: .android-signing/firstham-aethergui.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Set-Location android
          ./gradlew.bat assembleRelease bundleRelease lintRelease

      - name: Validate Android pull request build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat assembleDebug lintDebug

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe "release/Panther-VPN-v${version}-Windows-x64-Installer.exe"
          Copy-Item src-tauri/target/release/bundle/msi/*.msi "release/Panther-VPN-v${version}-Windows-x64.msi"
          Copy-Item src-tauri/target/release/aether-gui.exe "portable/Panther.exe"
          Copy-Item src-tauri/binaries/aether-x86_64-pc-windows-msvc.exe portable/aether.exe
          Copy-Item src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe portable/sing-box.exe
          Copy-Item LICENSE,NOTICE.md,TRADEMARK.md,third-party/sing-box-LICENSE.txt portable/
          Compress-Archive -Path portable/* -DestinationPath "release/Panther-VPN-v${version}-Windows-x64-portable.zip"
          Copy-Item android/app/build/outputs/apk/release/app-universal-release.apk "release/Panther-VPN-v${version}-Android-Universal.apk"
          Copy-Item android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release/Panther-VPN-v${version}-Android-ARMv7.apk"
          Copy-Item android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "release/Panther-VPN-v${version}-Android-ARM64.apk"
          Copy-Item android/app/build/outputs/apk/release/app-x86_64-release.apk "release/Panther-VPN-v${version}-Android-x86_64.apk"
          Copy-Item android/app/build/outputs/bundle/release/app-release.aab "release/Panther-VPN-v${version}-Android-AAB.aab"
          Get-ChildItem release -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }
          $bundle = "release/Panther-VPN-v${version}-all-platforms.zip"
          Compress-Archive -Path (Get-ChildItem release -File | Select-Object -ExpandProperty FullName) -DestinationPath $bundle
          $bundleHash = Get-FileHash $bundle -Algorithm SHA256
          "$($bundleHash.Hash.ToLower())  $([System.IO.Path]::GetFileName($bundle))" | Add-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Panther-VPN-Windows-Android
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            # Panther VPN

            Windows and Android release.

            - Exit-location picker with 31 Psiphon egress countries
            - warp-plus core now built from source for arm64, ARMv7 and x86_64
            - New UI experience
            - Aether Core upgraded to v1.7.0
            - Improved VPN stability and performance
            - Improved Split Tunneling
            - Improved update system
            - Better connection experience

            The bundled Aether Core and sing-box routing engine are fetched from official releases and SHA-256 verified during the build.
            Windows 10/11 x64 and Android 8.0+ are supported. Windows binaries are unsigned and may trigger a SmartScreen warning; Android APKs are release-signed.
