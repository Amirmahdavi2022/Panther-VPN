name: Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # So a failing build can report itself as an issue - CI logs are not always reachable.
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vpnLib (the OpenVPN engine) is a pinned submodule.
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem -Path @(
            (Join-Path $env:ANDROID_HOME 'cmdline-tools'),
            (Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools')
          ) -Filter 'sdkmanager.bat' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw 'Android sdkmanager.bat was not found on the hosted runner.' }
          & $sdkManager 'ndk;27.2.12479018'


      - name: Fetch verified Android native assets
        run: npm run fetch:android
      - name: Verify every native core landed in jniLibs
        shell: pwsh
        run: |
          # A green build once shipped with a core missing from it. Fail loudly instead.
          $missing = @()
          foreach ($abi in @('arm64-v8a','armeabi-v7a','x86_64')) {
            foreach ($lib in @('libaether.so','libhev-socks5-tunnel.so')) {
              $p = "android/app/src/main/jniLibs/$abi/$lib"
              if (-not (Test-Path $p)) { $missing += $p } else { Write-Host "$p $((Get-Item $p).Length) bytes" }
            }
          }
          if ($missing.Count) { throw "Native cores missing: $($missing -join ', ')" }

      - name: Run unit tests
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat --no-daemon --stacktrace testReleaseUnitTest 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Android signing key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force android/.android-signing | Out-Null
          [IO.File]::WriteAllBytes("android/.android-signing/firstham-aethergui.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed Android APKs
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: .android-signing/firstham-aethergui.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Set-Location android
          ./gradlew.bat --stacktrace assembleRelease bundleRelease lintRelease 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Android pull request build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat assembleDebug lintDebug

      - name: Report the failure as an issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gradle's message is the only thing that says why a build broke, and the raw log is
          # not always downloadable. Put the tail somewhere it can always be read.
          $logPath = Join-Path $env:GITHUB_WORKSPACE "build.log"
          if (Test-Path $logPath) {
            $tail = (Get-Content $logPath -Tail 120) -join [Environment]::NewLine
          } else {
            $tail = "No build.log was produced; the run failed before Gradle started."
          }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $fence = [string][char]96 * 3
          $lines = @(
            "Commit ``$short`` failed in [run $env:GITHUB_RUN_ID]($url).",
            "",
            "Last 120 lines of Gradle output:",
            "",
            $fence,
            $tail,
            $fence
          )
          Set-Content -Path failure.md -Value $lines -Encoding utf8
          gh issue create --title "Build failed on $short" --body-file failure.md | Write-Host

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item android/app/build/outputs/apk/release/app-universal-release.apk   "release/Panther-VPN-v${version}-Universal.apk"
          Copy-Item android/app/build/outputs/apk/release/app-arm64-v8a-release.apk   "release/Panther-VPN-v${version}-ARM64.apk"
          Copy-Item android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release/Panther-VPN-v${version}-ARMv7.apk"
          Copy-Item android/app/build/outputs/apk/release/app-x86_64-release.apk      "release/Panther-VPN-v${version}-x86_64.apk"
          Copy-Item android/app/build/outputs/bundle/release/app-release.aab          "release/Panther-VPN-v${version}.aab"
          Get-ChildItem release -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Panther-VPN-Android
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            # Panther VPN

            Android release.

            The bundled Aether Core is fetched from its official release and
            SHA-256 verified during the build. Android 8.0+ is supported and
            APKs are release-signed.
