name: Fix Dropdowns and Expand Locations

# One-shot. Run once from the Actions tab, then merge the pull request it opens.
#
# Fixes the real defect first: the dropdown popups rendered white text on a
# white background, so every list (location, protocol, scan mode, language)
# looked blank even though the items were there. Material 3 paints the exposed
# dropdown popup with the surface *container* colour roles, which this theme
# never defined, so they fell back to the light defaults.
#
# Then moves the exit-location picker onto the home page under the connect
# button, and grows it from 2 countries to all 31 the warp-plus core supports.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to create"
        required: true
        default: "fix/dropdowns-and-locations"

permissions:
  contents: write
  pull-requests: write

env:
  FIXUI_B64: ""
  LOCATIONS_B64: ""

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the files we rewrite are present
        run: |
          set -e
          for f in \
            android/app/src/main/res/layout/activity_main.xml \
            android/app/src/main/res/values/themes.xml \
            android/app/src/main/res/values-night/themes.xml \
            android/app/src/main/java/com/firstham/aethergui/Locations.java
          do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q 'location_layout' android/app/src/main/res/layout/activity_main.xml || { echo "::error::location picker not in layout"; exit 1; }
          echo "OK"

      - name: Fix dropdown colours and move the picker to the home page
        run: |
          set -e
          echo "$FIXUI_B64" | base64 -d > /tmp/fixui.py
          python3 /tmp/fixui.py

      - name: Expand to 31 countries
        run: |
          set -e
          echo "$LOCATIONS_B64" | base64 -d > /tmp/locations.py
          python3 /tmp/locations.py

      - name: Verify the result
        run: |
          python3 -c "
          import re, io, xml.etree.ElementTree as ET
          L = 'android/app/src/main/res/layout/activity_main.xml'
          for p in (L, 'android/app/src/main/res/values/themes.xml', 'android/app/src/main/res/values-night/themes.xml'):
              ET.parse(p)
          s = io.open(L, encoding='utf-8').read()
          assert s.count('@+id/location_layout') == 1, 'picker duplicated or lost'
          orb, loc, pill = s.find('@+id/connect_button'), s.find('@+id/location_layout'), s.find('@+id/connection_status_pill')
          assert orb < loc < pill, 'picker is not under the connect button'
          assert s.count('popupBackground') >= 9, 'dropdowns did not all get a popup background'
          ids = set(re.findall(r'@[+]id/([a-z_0-9]+)', s))
          for need in ('location_input','location_layout','location_summary','protocol_layout','scan_layout','transport_layout','language_input'):
              assert need in ids, 'lost id ' + need
          for d in ('values','values-fa'):
              p = 'android/app/src/main/res/%s/arrays.xml' % d
              ET.parse(p)
              body = re.search(r'<string-array name=\"location_labels\">(.*?)</string-array>', io.open(p, encoding='utf-8').read(), re.S).group(1)
              n = len(re.findall(r'<item>(.*?)</item>', body))
              assert n == 33, '%s has %d rows, expected 33' % (d, n)
          j = io.open('android/app/src/main/java/com/firstham/aethergui/Locations.java', encoding='utf-8').read()
          assert len(re.findall(r'^\s+\"([A-Z]{2})\"', j, re.M)) == 31, 'expected 31 country codes'
          assert j.count('{') == j.count('}'), 'unbalanced braces'
          print('verified: popups readable, picker on home page, 31 countries in both languages')
          "

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ inputs.branch }}
          commit-message: "fix: readable dropdowns, location picker on home, 31 countries"
          title: "Fix invisible dropdowns, move location picker home, add 31 countries"
          body: |
            **The actual bug:** dropdown popups drew near-white text on a
            near-white background, so the location, protocol, scan-mode and
            language lists all looked blank. Material 3 paints the exposed
            dropdown popup using the surface *container* roles, which this
            theme never defined, so they resolved to the light defaults.
            Fixed by defining those roles for both themes and by pinning an
            explicit popup background on all nine dropdown fields.

            Also in this change:

            * The exit-location picker now sits on the home page directly under
              the connect button, not buried in Configurations.
            * The country list grows from 2 to all 31 the warp-plus Psiphon core
              supports, with flags, in English and Persian.
            * The arm64-only gate is gone, since release.yml now builds the core
              for every shipped ABI.
          add-paths: |
            android/app/src/main/java/**
            android/app/src/main/res/**
