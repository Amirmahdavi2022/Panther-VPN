name: volunteer route test build 3

# One-shot. Adds round 3 on top of the volunteer-route branch (server-entry
# signature key) and starts a test build. main is not touched and no
# release is published; the APK lands as an artifact of the Android release run.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: volunteer-route
          fetch-depth: 0

      - name: Apply round 3
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/patch3.py"
          python3 "$RUNNER_TEMP/patch3.py"
          git config user.name "Panther"
          git config user.email "panther@users.noreply.invalid"
          git add -A android
          if git diff --cached --quiet; then echo "Nothing changed."; else git commit -q -m "Give Global the server-entry signature key"; fi
          git push origin HEAD:volunteer-route

      - name: Start the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref volunteer-route --repo "$GITHUB_REPOSITORY"
