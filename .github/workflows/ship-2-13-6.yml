name: ship 2.13.6

# One-shot. Upload it INTO .github/workflows/ (open that folder first, then upload).
# Works whether or not ship 2.13.5 already ran: main may be on 2.13.4 or 2.13.5.
#
# 1. Lets Turbo finish registering a new WARP identity (the 2.13.5 fix; skipped if already in).
# 2. Moves the Turbo core to Aether v2.1.0, whose camouflaged registration route adds an
#    SNI-split TLS 1.3 fingerprint, and which really applies the "firewall" noize profile that
#    Panther has always asked for (v2.0.0 did not know that name).
# 3. Version 2.13.6 / versionCode 39, tag v2.13.6, release build.
# Safe to run twice. Remove this file by hand afterwards.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ship-2-13-6.yml' ]

permissions:
  contents: write
  actions: write

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      TAG: v2.13.6
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check order
        id: guard
        run: |
          git fetch --tags -q origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE "versionName '2\.13\.(4|5)'" android/app/build.gradle; then
            echo "main is not on 2.13.4 or 2.13.5, stopping so nothing gets mixed up."
            exit 1
          fi

      - name: Give Turbo time to register
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/register_patch.py"
          python3 "$RUNNER_TEMP/register_patch.py"
          python3 -c "import xml.dom.minidom as m; m.parse('android/app/src/main/res/values/strings.xml')"
          grep -q "REGISTRATION_TIMEOUT_MS" android/app/src/main/java/com/firstham/aethergui/AetherVpnService.java

      - name: Move Turbo to Aether v2.1.0
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/core_patch.py"
          python3 "$RUNNER_TEMP/core_patch.py"
          grep -q 'v2.1.0}"' scripts/fetch-android-assets.sh
          grep -qF "**v2.1.0**" NOTICE.md

      - name: Move the version to 2.13.6
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          sed -i -E "s/versionCode (37|38)$/versionCode 39/; s/versionName '2\.13\.(4|5)'/versionName '2.13.6'/" android/app/build.gradle
          sed -i -E 's/"version": "2\.13\.(4|5)"/"version": "2.13.6"/' package.json
          grep -q "versionCode 39$" android/app/build.gradle
          grep -q "versionName '2.13.6'" android/app/build.gradle
          grep -q '"version": "2.13.6"' package.json
          git config user.name "Panther"
          git config user.email "panther@users.noreply.invalid"
          git add -A android package.json scripts NOTICE.md
          git commit -qm "Let Turbo finish registering, move it to Aether 2.1.0, release 2.13.6"
          git log -2 --format='%h %an %s'

      - name: Push main and the tag
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "$TAG"

      - name: Start the release build on the tag
        if: steps.guard.outputs.skip != '1'
        run: gh workflow run release.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
