name: beacon in about and readme

# One-shot. Beacon shipped without appearing anywhere a user actually looks: the About tagline
# still counted three engines, the "How it connects" list had three entries, and the README said
# "the three cards above the connect button". The one engine that depends on nothing else was the
# one nobody could read about.
#
# This adds the fourth entry to About in English, because no Persian goes inside the app,
# replaces the README with a Persian one that covers Beacon, and moves the version to 2.13.1.
# The version bump is here rather than left to the tag: release files are named after the tag,
# but the version the app shows comes from versionName and Android decides an APK is an update
# from versionCode, so tagging alone would ship a build calling itself the previous release.
#
# The README travels as base64. It is embedded in a YAML block scalar inside a shell heredoc, and
# right-to-left text carrying its own quotes and backticks has three chances to be mangled on the
# way through; encoded, it either decodes byte for byte or not at all.
#
# Nothing under .github/ is touched, so this file cannot delete itself. Remove it by hand after.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/beacon-about-readme.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write the patcher
        run: |
          cat > patch.py <<'PYFILE'
          """Adds Beacon to the About screen and replaces the README. Anchors must hit exactly once."""

          import base64
          import os
          import sys

          STRINGS = "android/app/src/main/res/values/strings.xml"
          LAYOUT = "android/app/src/main/res/layout/activity_main.xml"
          README = "README.md"

          EDITS = []


          def edit(path, old, new, note):
              EDITS.append((path, old, new, note))


          # --- The About screen still described three engines ---------------------------------------------
          #
          # Beacon shipped without appearing anywhere a user looks. The tagline counted three, the "How it
          # connects" section listed three, and the one engine that does not depend on any of the others was
          # the one nobody could read about.
          #
          # No apostrophes anywhere in the new strings. An unescaped one is valid XML and illegal to aapt,
          # it passes every check that runs before the build and then fails resource merging with a message
          # that names neither the character nor the string. Avoiding the character entirely beats
          # remembering to escape it.

          edit(
              STRINGS,
              '<string name="about_tagline">Three engines, one connect button.'
              '\\nNo account, nothing to paste in.</string>',
              '<string name="about_tagline">Four engines, one connect button.'
              '\\nNo account, nothing to paste in.</string>',
              "strings: the tagline counted three",
          )

          edit(
              STRINGS,
              '    <string name="about_support_title">Support channel</string>',
              '    <string name="about_mode_beacon_title">Beacon</string>\n'
              '    <string name="about_mode_beacon_body">The only engine that needs nothing else running'
              ' first. It reaches its own network by hiding its requests inside ordinary traffic to large'
              ' content providers, so it finds a way out of a filtered network on its own rather than'
              ' borrowing a tunnel from another engine. The exit is abroad and the engine picks it, so there'
              ' is no country to choose and it can differ each time you connect. The first connect after'
              ' installing is slow, sometimes a few minutes, because it has to fetch its configuration'
              ' before it has anywhere to send traffic; after that it is cached and quick. If it cannot come'
              ' up, Panther keeps you connected on Turbo instead of dropping you.</string>\n'
              '    <string name="about_support_title">Support channel</string>',
              "strings: add the Beacon entry",
          )

          edit(
              LAYOUT,
              '                        <TextView android:layout_width="match_parent"'
              ' android:layout_height="wrap_content" android:layout_marginTop="4dp"'
              ' android:lineSpacingMultiplier="1.25" android:text="@string/about_mode_stealth_body"'
              ' android:textColor="@color/muted" android:textSize="12sp" />\n'
              '                    </LinearLayout>',
              '                        <TextView android:layout_width="match_parent"'
              ' android:layout_height="wrap_content" android:layout_marginTop="4dp"'
              ' android:lineSpacingMultiplier="1.25" android:text="@string/about_mode_stealth_body"'
              ' android:textColor="@color/muted" android:textSize="12sp" />\n'
              '\n'
              '                        <TextView android:layout_width="wrap_content"'
              ' android:layout_height="wrap_content" android:layout_marginTop="14dp"'
              ' android:text="@string/about_mode_beacon_title" android:textColor="@color/blue_600"'
              ' android:textSize="13sp" android:textStyle="bold" />\n'
              '                        <TextView android:layout_width="match_parent"'
              ' android:layout_height="wrap_content" android:layout_marginTop="4dp"'
              ' android:lineSpacingMultiplier="1.25" android:text="@string/about_mode_beacon_body"'
              ' android:textColor="@color/muted" android:textSize="12sp" />\n'
              '                    </LinearLayout>',
              "layout: add the Beacon block after Prowl",
          )


          # --- The version ---------------------------------------------------------------------------------
          #
          # v2.13.0 is already tagged and built, so anything that lands after it needs its own number. The
          # release files are named after the tag, but the version the app shows itself comes from
          # versionName, and versionCode is what Android uses to decide something is an update at all - so a
          # tag alone would ship a build calling itself the previous version and refusing to install over it.
          # Both live in exactly two files.

          edit(
              "android/app/build.gradle",
              "        versionCode 34\n        versionName '2.13.0'",
              "        versionCode 35\n        versionName '2.13.1'",
              "gradle: version",
          )

          edit(
              "package.json",
              '  "version": "2.13.0",',
              '  "version": "2.13.1",',
              "package.json: version",
          )


          # --- The README ---------------------------------------------------------------------------------
          #
          # Rewritten in Persian at the owner request, and carrying Beacon. Base64 rather than inline text:
          # the file is embedded in a YAML block scalar inside a shell heredoc, and right-to-left text with
          # its own quotes and backticks has three chances to be mangled on the way through. Encoded, it
          # either decodes byte for byte or it does not decode at all.

          README_B64 = ""


          def main():
              root = os.getcwd()
              failures = []
              changes = {}
              for path, old, new, note in EDITS:
                  full = os.path.join(root, path)
                  if not os.path.isfile(full):
                      failures.append("missing file: " + path)
                      continue
                  text = changes.get(path)
                  if text is None:
                      with open(full, encoding="utf-8") as handle:
                          text = handle.read()
                  hits = text.count(old)
                  if hits != 1:
                      failures.append("%s: %d matches for [%s]" % (path, hits, note))
                      continue
                  changes[path] = text.replace(old, new, 1)

              readme = base64.b64decode(README_B64)
              if not readme.startswith("# Panther VPN".encode("utf-8")):
                  failures.append("README did not decode to the expected document")

              if failures:
                  print("Nothing was written. Problems:")
                  for line in failures:
                      print("  - " + line)
                  sys.exit(1)

              for path, text in changes.items():
                  with open(os.path.join(root, path), "w", encoding="utf-8") as handle:
                      handle.write(text)
                  print("patched " + path)
              with open(os.path.join(root, README), "wb") as handle:
                  handle.write(readme)
              print("rewrote " + README + " (%d bytes)" % len(readme))
              print("%d replacements applied" % len(EDITS))


          if __name__ == "__main__":
              main()
          PYFILE

      - name: Apply it
        run: python3 patch.py

      - name: Check the XML still parses
        run: |
          python3 - <<'CHECK'
          import re, sys, xml.etree.ElementTree as ET
          bad = []
          for p in ["android/app/src/main/res/values/strings.xml",
                    "android/app/src/main/res/layout/activity_main.xml"]:
              ET.parse(p)
              print("XML OK:", p)
          # An unescaped apostrophe inside a <string> is valid XML and illegal to aapt, and the
          # failure names neither the file nor the character. Catch it here, not in a build.
          text = open("android/app/src/main/res/values/strings.xml", encoding="utf-8").read()
          for m in re.finditer(r'<string name="([^"]+)"[^>]*>(.*?)</string>', text, re.S):
              value = m.group(2)
              for i, ch in enumerate(value):
                  if ch == "'" and (i == 0 or value[i - 1] != "\\"):
                      bad.append(m.group(1))
                      break
          if bad:
              print("Unescaped apostrophes in:", bad)
              sys.exit(1)
          print("no unescaped apostrophes")
          CHECK

      - name: Commit
        run: |
          rm -f patch.py
          if git diff --quiet; then
            echo "Nothing changed - already applied."
            exit 0
          fi
          git config user.name 'Panther'
          git config user.email 'panther@users.noreply.invalid'
          git add -A
          git commit -m 'Put Beacon in About, and rewrite the README'
          git push origin HEAD:main
