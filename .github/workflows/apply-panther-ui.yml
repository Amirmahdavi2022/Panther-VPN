      - name: Extract changeset over the repository
        run: |
          tar xzf /tmp/ui/changeset.tgz -C .
          echo "--- extracted ---"
          git status --porcelain

      - name: Generate brand logo drawable
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp brand/logo.png android/app/src/main/res/drawable-nodpi/ic_brand_logo.png
          ls -la android/app/src/main/res/drawable-nodpi/

      - name: Verify
        run: |
          set -e
          test -f android/app/src/main/res/drawable-nodpi/ic_brand_logo.png
          test -f android/app/src/main/res/menu/bottom_menu.xml
          test -f android/app/src/main/res/color/bottom_nav_item.xml
          test -f android/app/src/main/res/drawable/card_background.xml
          grep -q "versionName '1.4.0'" android/app/build.gradle
          grep -q 'versionCode 2' android/app/build.gradle
          grep -q 'v1.4.0' android/app/src/main/res/values/strings.xml
          ! grep -rq 'original_project\|aether_credit\|aethon_repository' android/app/src/main/res/values*/strings.xml
          ! grep -rq '1\.0\.0' package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          python3 - <<'PY'
          import glob, xml.dom.minidom as md
          bad = []
          for f in glob.glob('android/app/src/main/res/**/*.xml', recursive=True):
              try:
                  md.parse(f)
              except Exception as e:
                  bad.append((f, str(e)))
          assert not bad, bad
          print('all %d xml resources parse' % len(glob.glob('android/app/src/main/res/**/*.xml', recursive=True)))
          PY
          echo "verify ok"

      - name: Run project test suite
        run: |
          node --experimental-vm-modules --test tests/frontend.test.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI: dark Panther theme, cleaned About, no update section, v1.4.0"
          git push
